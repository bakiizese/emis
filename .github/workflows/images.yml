name: Images

# Builds the three production images (API and worker, website, portal), proves the whole production
# stack boots and is locked down, and on main and version tags publishes them to GitHub's container
# registry with build provenance, an SBOM and a signature.

on:
  pull_request:
    paths:
      - 'infra/docker/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/images.yml'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKERFILE: infra/docker/Dockerfile

jobs:
  stack:
    name: Production stack builds and boots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the API and worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: api
          load: true
          tags: emis-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the website image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: web
          load: true
          tags: emis-web:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=web,mode=max

      - name: Build the portal image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: portal
          load: true
          tags: emis-portal:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=portal,mode=max

      - name: Scan the API and worker image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: emis-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan the website image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: emis-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan the portal image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: emis-portal:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Start the production stack
        working-directory: infra/docker
        run: |
          cat > .env <<ENV
          WEB_URL=http://web.localhost:8081
          PORTAL_URL=http://portal.localhost:8081
          WEB_ADDRESS=http://web.localhost
          PORTAL_ADDRESS=http://portal.localhost
          HTTP_PORT=8081
          HTTPS_PORT=8444
          EMIS_IMAGE_PREFIX=emis
          EMIS_TAG=ci
          POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 16)
          EMIS_DB_MIGRATOR_PASSWORD=$(openssl rand -hex 16)
          EMIS_DB_APP_PASSWORD=$(openssl rand -hex 16)
          EMIS_DB_READONLY_PASSWORD=$(openssl rand -hex 16)
          VALKEY_PASSWORD=$(openssl rand -hex 16)
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          MAIL_FROM=EMIS <no-reply@example.test>
          ENV
          docker compose -p emis-ci --env-file .env -f compose.prod.yml -f compose.smoke.yml up -d

      - name: Check it is healthy and locked down
        working-directory: infra/docker
        env:
          COMPOSE: docker compose -p emis-ci --env-file .env -f compose.prod.yml -f compose.smoke.yml
          WEB_HOST: web.localhost
          PORTAL_HOST: portal.localhost
          PORT: '8081'
        run: ./smoke.sh

      - name: Show the logs when it fails
        if: failure()
        working-directory: infra/docker
        run: docker compose -p emis-ci --env-file .env -f compose.prod.yml -f compose.smoke.yml logs --tail=80

  publish:
    name: Publish ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    needs: stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    strategy:
      fail-fast: false
      matrix:
        target: [api, web, portal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/emis-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
