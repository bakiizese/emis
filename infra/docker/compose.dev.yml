# Local development services. Start with `pnpm infra:up` (reads ../../.env).
# All ports bind to 127.0.0.1 so nothing is exposed on the network.
name: emis-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-emis}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-emis} -d ${POSTGRES_DB:-emis}']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}',
      ]
    ports:
      - 127.0.0.1:${VALKEY_PORT:-6380}:6379
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$${VALKEY_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  # S3-compatible object storage. The app speaks plain S3, so any S3 server works in production.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-emis}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - 127.0.0.1:${S3_PORT:-9000}:9000
      - 127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001
    volumes:
      - s3-data:/data

  # HTML -> PDF (receipts, IDs, certificates).
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - 127.0.0.1:${GOTENBERG_PORT:-3100}:3000

  # Catches all outgoing email in development: UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - 127.0.0.1:${SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025

volumes:
  postgres-data:
  valkey-data:
  s3-data:
