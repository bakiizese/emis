# Extra pieces for trying the production stack on a machine that is not a real server (and in CI):
# a mail catcher so the worker has somewhere to deliver, reachable only inside the stack.
#
#   docker compose --env-file .env -f compose.prod.yml -f compose.smoke.yml up -d
services:
  mailpit:
    image: axllent/mailpit:v1.31
    networks: [egress]

  # Offsite storage for the test is a plain folder, so the whole copy-and-restore path is exercised.
  offsite:
    # The test's "offsite" is a folder on a Docker volume, which only root can write to.
    user: root
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: local
      OFFSITE_PATH: /offsite
      OFFSITE_EVERY_SECONDS: '10'
    volumes:
      - offsite-test:/offsite

volumes:
  offsite-test:
